<div id="llmManagement" class="camera-frame rounded-2xl p-6 mt-6">
    <div class="flex items-center mb-6">
        <h3 class="text-xl text-primary-400 font-bold">LLM Model Management</h3>
        <div class="ml-auto">
            <button onclick="refreshLLMConnection()" class="px-3 py-1 bg-primary-600/70 text-white rounded-lg hover:bg-primary-500/70 transition">
                <span id="llmConnectionStatus" class="inline-block w-3 h-3 rounded-full bg-red-500 mr-2"></span>
                Refresh Connection
            </button>
        </div>
    </div>

    <div id="llmStatusMessage" class="mb-4 text-center py-2 px-4 rounded-md hidden"></div>

    <div class="mb-6">
        <h4 class="text-gray-300 mb-2">Current Model</h4>
        <div id="currentModelInfo" class="p-3 bg-black/50 rounded-lg border border-primary-500/30">
            <div id="noModelSelectedMessage" class="text-gray-400 text-center py-2">
                No model selected. Install or select a model below to enable AI analysis.
            </div>
            <div id="selectedModelDetails" class="hidden">
                <div class="flex justify-between items-center">
                    <span id="currentModelName" class="font-mono text-primary-400"></span>
                    <span id="currentModelSize" class="text-sm text-gray-400"></span>
                </div>
                <p id="currentModelDescription" class="text-sm text-gray-300 mt-1"></p>
            </div>
        </div>
    </div>

    <div class="mb-6">
        <h4 class="text-gray-300 mb-2">Installed Models</h4>
        <div id="installedModelsContainer" class="space-y-2 max-h-48 overflow-y-auto p-2">
            <div id="noInstalledModelsMessage" class="text-gray-400 text-center py-4">
                No vision models installed. Install a model below.
            </div>
            <div id="installedModelsList" class="hidden"></div>
        </div>
    </div>

    <div>
        <h4 class="text-gray-300 mb-2">Available Models</h4>
        <div id="availableModelsContainer" class="space-y-2 max-h-48 overflow-y-auto p-2">
            <div id="availableModelsList"></div>
        </div>
    </div>
</div>

<script>
    let modelInstallationTimers = {};

    document.addEventListener('DOMContentLoaded', function() {
        getLLMStatus();
    });

    function getLLMStatus() {
        fetch('/llm/status')
            .then(response => response.json())
            .then(data => {
                updateLLMUI(data);
            })
            .catch(error => {
                console.error('Error fetching LLM status:', error);
                document.getElementById('llmConnectionStatus').classList.replace('bg-green-500', 'bg-red-500');
            });
    }

    function refreshLLMConnection() {
        fetch('/llm/refresh', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            }
        })
            .then(response => response.json())
            .then(data => {
                updateLLMUI(data);
                showStatusMessage('Connection refreshed', 'success');
            })
            .catch(error => {
                console.error('Error refreshing connection:', error);
                showStatusMessage('Failed to refresh connection', 'error');
            });
    }

    function setLLMModel(modelName) {
        fetch('/llm/set_model', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ model_name: modelName }),
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatusMessage(data.message, 'success');
                    getLLMStatus();
                } else {
                    showStatusMessage(data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Error setting model:', error);
                showStatusMessage('Failed to set model', 'error');
            });
    }

    function installLLMModel(modelName) {
        fetch('/llm/install_model', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ model_name: modelName }),
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatusMessage(`Installing ${modelName}...`, 'info');

                    const availModelEl = document.getElementById(`available-model-${modelName.replace(/[:\/]/g, '-')}`);
                    if (availModelEl) {
                        const installBtn = availModelEl.querySelector('.install-btn');
                        if (installBtn) {
                            installBtn.disabled = true;
                            installBtn.textContent = 'Installing...';
                        }
                    }

                    if (!modelInstallationTimers[modelName]) {
                        modelInstallationTimers[modelName] = setInterval(() => {
                            checkInstallationStatus(modelName);
                        }, 3000);
                    }
                } else {
                    showStatusMessage(data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Error installing model:', error);
                showStatusMessage('Failed to start installation', 'error');
            });
    }

    function checkInstallationStatus(modelName) {
        fetch(`/llm/installation_status/${modelName}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'completed' || data.status === 'error') {
                    clearInterval(modelInstallationTimers[modelName]);
                    delete modelInstallationTimers[modelName];

                    if (data.status === 'completed') {
                        showStatusMessage(`${modelName} installed successfully!`, 'success');
                    } else {
                        showStatusMessage(`Installation failed: ${data.message}`, 'error');
                    }

                    getLLMStatus();
                }
            })
            .catch(error => {
                console.error('Error checking installation status:', error);
            });
    }

    function removeLLMModel(modelName) {
        if (!confirm(`Are you sure you want to remove model ${modelName}?`)) {
            return;
        }

        fetch('/llm/remove_model', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ model_name: modelName }),
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatusMessage(data.message, 'success');
                    getLLMStatus();
                } else {
                    showStatusMessage(data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Error removing model:', error);
                showStatusMessage('Failed to remove model', 'error');
            });
    }

    function updateLLMUI(data) {
        const connectionStatus = document.getElementById('llmConnectionStatus');
        if (data.connected) {
            connectionStatus.classList.replace('bg-red-500', 'bg-green-500');
        } else {
            connectionStatus.classList.replace('bg-green-500', 'bg-red-500');
        }

        const currentModelName = document.getElementById('currentModelName');
        const currentModelSize = document.getElementById('currentModelSize');
        const currentModelDescription = document.getElementById('currentModelDescription');
        const selectedModelDetails = document.getElementById('selectedModelDetails');
        const noModelSelectedMessage = document.getElementById('noModelSelectedMessage');

        if (data.current_model) {
            const modelDetails = findModelDetails(data.current_model, data.installed_models, data.popular_models);

            currentModelName.textContent = data.current_model;
            currentModelSize.textContent = modelDetails.size || '';
            currentModelDescription.textContent = modelDetails.description || '';

            selectedModelDetails.classList.remove('hidden');
            noModelSelectedMessage.classList.add('hidden');
        } else {
            selectedModelDetails.classList.add('hidden');
            noModelSelectedMessage.classList.remove('hidden');
        }

        const installedModelsContainer = document.getElementById('installedModelsList');
        const noInstalledModelsMessage = document.getElementById('noInstalledModelsMessage');

        if (data.installed_models.length > 0) {
            installedModelsContainer.classList.remove('hidden');
            noInstalledModelsMessage.classList.add('hidden');

            installedModelsContainer.innerHTML = '';

            const sortedModels = data.installed_models.sort((a, b) => {
                const aIsVision = a.type === 'vision';
                const bIsVision = b.type === 'vision';

                if (aIsVision && !bIsVision) return -1;
                if (!aIsVision && bIsVision) return 1;
                return a.name.localeCompare(b.name);
            });

            sortedModels.forEach(model => {
                const isSelected = model.name === data.current_model;
                const isVision = model.type === 'vision';

                const modelEl = document.createElement('div');
                modelEl.id = `installed-model-${model.name.replace(/[:\/]/g, '-')}`;
                modelEl.className = `flex justify-between items-center p-3 rounded-lg ${isSelected ? 'bg-primary-900/50 border border-primary-500' : 'bg-black/50 border border-primary-500/30'}`;

                const size = formatSize(model.size);
                const modelType = isVision ? '🔍 Vision' : '📝 Text';
                const recommendation = !isVision ? '<div class="text-xs text-yellow-400">⚠️ Text-only model - limited for image analysis</div>' : '';

                modelEl.innerHTML = `
                <div class="flex-1">
                    <div class="flex items-center gap-2">
                        <span class="font-mono text-primary-300">${model.name}</span>
                        <span class="text-xs px-2 py-1 rounded ${isVision ? 'bg-green-600/30 text-green-300' : 'bg-yellow-600/30 text-yellow-300'}">${modelType}</span>
                    </div>
                    <div class="text-sm text-gray-400">${size}</div>
                    ${recommendation}
                </div>
                <div class="flex gap-2">
                    ${!isSelected ? `<button onclick="setLLMModel('${model.name}')" class="select-btn px-3 py-1 bg-primary-600/70 text-white text-sm rounded hover:bg-primary-500/70">Select</button>` : ''}
                    <button onclick="removeLLMModel('${model.name}')" class="remove-btn px-3 py-1 bg-red-600/70 text-white font-bold border-[0.1px] border-white text-sm rounded hover:bg-red-500/70">Remove</button>
                </div>
            `;

                installedModelsContainer.appendChild(modelEl);
            });
        } else {
            installedModelsContainer.classList.add('hidden');
            noInstalledModelsMessage.classList.remove('hidden');
        }

        const availableModelsContainer = document.getElementById('availableModelsList');
        availableModelsContainer.innerHTML = '';

        const installedModelNames = data.installed_models.map(m => m.name);

        data.popular_models.forEach(model => {
            if (!installedModelNames.includes(model.name)) {
                const modelEl = document.createElement('div');
                modelEl.id = `available-model-${model.name.replace(/[:\/]/g, '-')}`;
                modelEl.className = 'flex justify-between items-center p-3 rounded-lg bg-black/50 border border-primary-500/30';

                modelEl.innerHTML = `
                    <div class="flex-1">
                        <div class="font-mono text-primary-300">${model.name}</div>
                        <div class="text-sm text-gray-400">${model.size}</div>
                        <div class="text-xs text-gray-300 mt-1">${model.description || ''}</div>
                    </div>
                    <div>
                        <button onclick="installLLMModel('${model.name}')" class="install-btn px-3 py-1 bg-primary-600/70 text-white text-sm rounded hover:bg-primary-500/70">Install</button>
                    </div>
                `;

                availableModelsContainer.appendChild(modelEl);
            }
        });

        for (const [modelName, timerId] of Object.entries(modelInstallationTimers)) {
            const modelId = modelName.replace(/[:\/]/g, '-');
            const modelEl = document.getElementById(`available-model-${modelId}`);
            if (modelEl) {
                const installBtn = modelEl.querySelector('.install-btn');
                if (installBtn) {
                    installBtn.disabled = true;
                    installBtn.textContent = 'Installing...';
                }
            }
        }
    }

    function findModelDetails(modelName, installedModels, popularModels) {
        const installedModel = installedModels.find(m => m.name === modelName);
        if (installedModel) {
            return {
                size: formatSize(installedModel.size),
                description: ''
            };
        }

        const popularModel = popularModels.find(m => m.name === modelName);
        if (popularModel) {
            return {
                size: popularModel.size,
                description: popularModel.description
            };
        }

        return { size: '', description: '' };
    }

    function showStatusMessage(message, type) {
        const statusEl = document.getElementById('llmStatusMessage');
        statusEl.textContent = message;
        statusEl.classList.remove('hidden', 'bg-green-600/70', 'bg-red-600/70', 'bg-primary-600/70');

        switch (type) {
            case 'success':
                statusEl.classList.add('bg-green-600/70', 'text-white');
                break;
            case 'error':
                statusEl.classList.add('bg-red-600/70', 'text-white');
                break;
            case 'info':
            default:
                statusEl.classList.add('bg-primary-600/70', 'text-white');
                break;
        }

        statusEl.classList.remove('hidden');

        setTimeout(() => {
            statusEl.classList.add('hidden');
        }, 5000);
    }

    function formatSize(bytes) {
        if (!bytes) return '';

        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let size = parseInt(bytes);
        let unitIndex = 0;

        while (size >= 1024 && unitIndex < units.length - 1) {
            size /= 1024;
            unitIndex++;
        }

        return `${size.toFixed(1)} ${units[unitIndex]}`;
    }
</script>
