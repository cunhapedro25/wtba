<!-- Detection Preview -->
<div id="detections" class="hidden bg-black/60 backdrop-blur-md rounded-2xl mt-8 overflow-hidden">
    <div class="flex items-center justify-between p-4 bg-black/60 border-b border-primary-500/30">
        <div class="flex items-center space-x-4">
            <button id="backButton"
                    class="flex items-center px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg transition-all duration-300 font-bold uppercase tracking-wide">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back
            </button>
            <div class="text-primary-400 text-lg font-bold uppercase tracking-wide">Detection Preview</div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 bg-black/60 px-3 py-1 rounded-full border border-primary-500/30">
                <div id="statusDot" class="w-2 h-2 bg-primary-500 rounded-full animate-pulse"></div>
                <span id="statusIndicator" class="text-primary-400 text-xs font-bold">WAITING</span>
            </div>
        </div>
    </div>

    <div class="detection-preview rounded-b-2xl flex flex-col overflow-hidden">
        <div id="mediaContainer" class="w-full flex items-center justify-center p-6 relative bg-black/40 min-h-[400px] transition-all duration-500">
            <img id="imageDisplay" src="" alt="Detection Result"
                 class="max-w-full max-h-[400px] rounded-xl shadow-2xl hidden">
            <video id="videoDisplay" class="max-w-full max-h-[70vh] rounded-xl shadow-2xl hidden" controls autoplay
                   muted></video>
            <img id="videoStream" class="max-w-full max-h-[70vh] rounded-xl shadow-2xl hidden" alt="Video Stream">

            <div id="loadingOverlay"
                 class="absolute inset-0 flex items-center justify-center bg-black/50 rounded-xl hidden">
                <div class="text-center">
                    <div class="relative w-16 h-16 mx-auto mb-4">
                        <!-- Outer rotating ring -->
                        <div class="absolute inset-0 rounded-full border-4 border-transparent border-t-primary-400 border-r-primary-400 animate-spin"></div>
                        <!-- Inner pulsing dot -->
                        <div class="absolute inset-0 flex items-center justify-center">
                            <div class="w-3 h-3 bg-primary-400 rounded-full animate-pulse"></div>
                        </div>
                        <!-- Outer glow effect -->
                        <div class="absolute inset-0 rounded-full border-2 border-primary-400/20 animate-ping"></div>
                    </div>
                    <div id="loadingText" class="text-white font-bold text-lg">Processing...</div>
                </div>
            </div>

            <div id="initialPlaceholder" class="text-center text-gray-500">
                <div class="relative w-16 h-16 mx-auto mb-4">
                    <!-- Outer rotating ring -->
                    <div class="absolute inset-0 rounded-full border-4 border-transparent border-t-primary-400 border-r-primary-400 animate-spin"></div>
                    <!-- Inner pulsing dot -->
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="w-3 h-3 bg-primary-400 rounded-full animate-pulse"></div>
                    </div>
                    <!-- Outer glow effect -->
                    <div class="absolute inset-0 rounded-full border-2 border-primary-400/20 animate-ping"></div>
                </div>
                <p class="text-xl font-bold">Processing...</p>
            </div>
        </div>

        <div id="infoPanels" class="flex flex-row border-t border-primary-500/30">
            <div id="liveStatsPanel" class="flex-1 p-6 border-r border-primary-500/30 bg-black/40">
                <div class="flex items-center mb-4">
                    <div class="status-dot animate-pulse-green mr-3"></div>
                    <h3 class="text-lg font-bold text-primary-400 uppercase tracking-wide">Live Stats</h3>
                </div>
                <div id="classStats" class="space-y-3 text-sm">
                    <div class="flex justify-between p-2 bg-black/40 rounded">
                        <span class="text-gray-300 uppercase">Frames:</span>
                        <span id="frameCount" class="text-primary-300 font-bold">0</span>
                    </div>
                    <div class="flex justify-between p-2 bg-black/40 rounded">
                        <span class="text-gray-300 uppercase">Detections:</span>
                        <span id="detectionCount" class="text-primary-400 font-bold">0</span>
                    </div>
                </div>
            </div>

            <div id="finalSummary" class="flex-1 p-6 bg-black/40 border-r border-primary-500/30">
                <h3 class="text-lg font-bold text-primary-400 mb-3 uppercase tracking-wide">Summary</h3>
                <div id="summaryContent" class="text-sm text-gray-300"></div>
            </div>

            <div id="detectionsPanel" class="flex-1 p-6 bg-black/40">
                <h3 class="text-lg font-bold text-primary-400 mb-4 uppercase tracking-wide">Detections</h3>
                <div id="detectionsList" class="space-y-3 max-h-64 overflow-y-auto">
                    <div class="text-center text-gray-500 py-12">
                        <div class="text-4xl mb-3">🔍</div>
                        <p class="text-sm">No detections yet...</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="llmAnalysis" class="hidden w-full p-6 border-t border-primary-500/30 bg-black/40">
            <div class="flex items-center mb-3">
                <span class="text-2xl mr-2">🤖</span>
                <h3 class="text-lg font-bold text-primary-400 uppercase tracking-wide">AI Analysis</h3>
            </div>
            <div id="llmContent" class="text-sm text-gray-300 prose prose-invert max-w-none"></div>
        </div>
    </div>
</div>

<style>
    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
    }

    .animate-pulse-green {
        animation: pulse-green 2s infinite;
    }

    @keyframes pulse-green {
        0%, 100% {
            opacity: 1;
            background-color: #10b981;
        }
        50% {
            opacity: 0.5;
            background-color: #059669;
        }
    }

    /* Image container sizing */
    .image-mode {
        min-height: 300px !important;
        padding: 1.5rem !important;
    }

    .processing-mode {
        min-height: 400px !important;
        padding: 2rem !important;
    }

    .video-mode {
        min-height: 400px !important;
        padding: 1.5rem !important;
    }
</style>

<script>
    let isProcessing = false;
    let isYoutube = false;
    let statsInterval = null;
    let isVideo = false;

    function truncateFilename(filename, maxLength = 30) {
        if (!filename || filename.length <= maxLength) return filename;
        const extension = filename.lastIndexOf('.') > 0 ? filename.substring(filename.lastIndexOf('.')) : '';
        const nameWithoutExt = filename.substring(0, filename.lastIndexOf('.')) || filename;
        const truncatedName = nameWithoutExt.substring(0, maxLength - extension.length - 3) + '...';
        return truncatedName + extension;
    }

    function updateInfoPanelsLayout() {
        const liveStatsPanel = document.getElementById('liveStatsPanel');
        const finalSummary = document.getElementById('finalSummary');
        const detectionsPanel = document.getElementById('detectionsPanel');

        if (isVideo) {
            liveStatsPanel.style.display = 'block';
            liveStatsPanel.classList.remove('hidden');
            detectionsPanel.style.display = 'none';
            finalSummary.classList.remove('border-r');
        } else {
            liveStatsPanel.style.display = 'none';
            liveStatsPanel.classList.add('hidden');
            detectionsPanel.style.display = 'block';
            finalSummary.classList.add('border-r');
        }
    }

    function updateMediaContainerSize(mode) {
        const container = document.getElementById('mediaContainer');

        // Remove all mode classes
        container.classList.remove('image-mode', 'processing-mode', 'video-mode');

        // Add the appropriate mode class
        container.classList.add(mode + '-mode');
    }

    document.getElementById('backButton').addEventListener('click', () => {
        fetch('/stop_processing', { method: 'POST' }).catch(() => {});
        clearInterval(statsInterval);
        isProcessing = false;
        isYoutube = false;
        isVideo = false;
        resetView();
    });

    function showDetections() {
        document.getElementById('options').classList.add('hidden');
        document.getElementById('detections').classList.remove('hidden');
        resetDetectionState();
    }

    function resetView() {
        document.getElementById('detections').classList.add('hidden');
        document.getElementById('options').classList.remove('hidden');
        document.getElementById('youtubeUrl').value = '';
        resetYoutubeButton();
        document.getElementById('imageInput').value = '';
        document.getElementById('videoInput').value = '';
    }

    function resetDetectionState() {
        clearInterval(statsInterval);
        document.getElementById('statusIndicator').textContent = 'WAITING';
        document.getElementById('frameCount').textContent = '0';
        document.getElementById('detectionCount').textContent = '0';
        document.getElementById('initialPlaceholder').style.display = 'flex';
        document.getElementById('imageDisplay').style.display = 'none';
        document.getElementById('videoDisplay').style.display = 'none';
        document.getElementById('videoStream').style.display = 'none';
        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('llmAnalysis').classList.add('hidden');

        // Reset to processing mode
        updateMediaContainerSize('processing');

        document.getElementById('detectionsList').innerHTML = `
            <div class="text-center text-gray-500 py-12">
                <div class="text-4xl mb-3">🔍</div>
                <p class="text-sm">No detections yet...</p>
            </div>`;

        document.getElementById('classStats').innerHTML = `
            <div class="flex justify-between p-2 bg-black/40 rounded">
                <span class="text-gray-300 uppercase">Frames:</span>
                <span id="frameCount" class="text-primary-300 font-bold">0</span>
            </div>
            <div class="flex justify-between p-2 bg-black/40 rounded">
                <span class="text-gray-300 uppercase">Detections:</span>
                <span id="detectionCount" class="text-primary-400 font-bold">0</span>
            </div>`;

        updateInfoPanelsLayout();
    }

    function showStatus(message, isError = false) {
        document.getElementById('statusIndicator').textContent = isError ? 'ERROR' : 'PROCESSING';
        document.getElementById('statusDot').style.background = isError ? '#ef4444' : '#10b981';
        document.getElementById('loadingText').textContent = message;
        document.getElementById('loadingOverlay').style.display = 'flex';
        document.getElementById('initialPlaceholder').style.display = 'none';

        // Set to processing mode when showing status
        updateMediaContainerSize('processing');
    }

    function hideStatus() {
        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('statusDot').style.background = '#10b981';
        document.getElementById('initialPlaceholder').style.display = 'none';
    }

    function processYoutube() {
        const url = document.getElementById('youtubeUrl').value.trim();
        if (!url) {
            showStatus('Please enter a YouTube URL', true);
            return;
        }

        showDetections();
        showStatus('Downloading YouTube video...');
        isProcessing = true;
        isYoutube = true;
        isVideo = true;
        updateInfoPanelsLayout();

        const processBtn = document.getElementById('youtubeProcessBtn');
        processBtn.disabled = true;
        processBtn.textContent = 'PROCESSING...';
        processBtn.classList.add('opacity-50');

        fetch('/youtube_video', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                url: url,
                confidence: window.getCurrentConfidence()
            })
        })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    showStatus('Error: ' + data.error, true);
                    isProcessing = false;
                    resetYoutubeButton();
                } else {
                    pollYoutubeStatus();
                }
            })
            .catch(error => {
                showStatus('Error: ' + error.message, true);
                isProcessing = false;
                resetYoutubeButton();
            });
    }

    function pollYoutubeStatus() {
        if (!isProcessing || !isYoutube) return;

        fetch('/get_results')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ready_to_stream') {
                    showStatus('YouTube video ready! Starting stream...');
                    startVideoStream();
                    resetYoutubeButton();
                } else if (data.status === 'error') {
                    showStatus('Error: ' + data.error, true);
                    isProcessing = false;
                    resetYoutubeButton();
                } else {
                    showStatus(data.message || 'Downloading YouTube video...');
                    setTimeout(pollYoutubeStatus, 2000);
                }
            })
            .catch(error => {
                console.error('Status polling error:', error);
                setTimeout(pollYoutubeStatus, 3000);
            });
    }

    function startVideoStream() {
        isProcessing = true;
        isVideo = true;
        updateInfoPanelsLayout();
        updateMediaContainerSize('video');

        document.getElementById('statusIndicator').textContent = 'STREAMING';
        document.getElementById('initialPlaceholder').style.display = 'none';
        document.getElementById('imageDisplay').style.display = 'none';
        document.getElementById('videoDisplay').style.display = 'none';

        const img = document.getElementById('videoStream');
        img.src = '/video_feed?' + new Date().getTime();
        img.style.display = 'block';

        if (statsInterval) clearInterval(statsInterval);
        statsInterval = setInterval(pollStats, 1000);
        hideStatus();
    }

    function pollStats() {
        if (!isProcessing) {
            clearInterval(statsInterval);
            return;
        }

        fetch('/get_stats')
            .then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            })
            .then(stats => {
                document.getElementById('frameCount').textContent = stats.frames_processed || 0;
                document.getElementById('detectionCount').textContent = stats.total_detections || 0;

                const classDetections = stats.detections_by_class || {};
                const classHtml = Object.entries(classDetections)
                    .map(([className, count]) =>
                        `<div class="flex justify-between p-2 bg-black/40 rounded">
                        <span class="text-gray-300 uppercase">${className}:</span>
                        <span class="text-primary-300 font-bold">${count}</span>
                    </div>`
                    ).join('');

                document.getElementById('classStats').innerHTML = `
                <div class="flex justify-between p-2 bg-black/40 rounded">
                    <span class="text-gray-300 uppercase">Frames:</span>
                    <span id="frameCount" class="text-primary-300 font-bold">${stats.frames_processed || 0}</span>
                </div>
                <div class="flex justify-between p-2 bg-black/40 rounded">
                    <span class="text-gray-300 uppercase">Detections:</span>
                    <span id="detectionCount" class="text-primary-400 font-bold">${stats.total_detections || 0}</span>
                </div>
                ${classHtml}`;

                if (stats.finished) {
                    isProcessing = false;
                    document.getElementById('statusIndicator').textContent = 'COMPLETE';
                    clearInterval(statsInterval);
                }
            })
            .catch(err => {
                console.error('Stats polling error:', err);
            });
    }

    function displayImageResults(data) {
        resetDetectionState();
        isProcessing = false;
        isVideo = false;
        updateInfoPanelsLayout();

        // Switch to image mode for smaller container
        updateMediaContainerSize('image');

        document.getElementById('statusIndicator').textContent = 'COMPLETE';
        document.getElementById('initialPlaceholder').style.display = 'none';

        const img = document.getElementById('imageDisplay');
        img.src = data.image;
        img.style.display = 'block';

        renderDetections(data.detections, data.summary);

        if (data.llm_analysis && data.llm_analysis.trim() !== '') {
            document.getElementById('llmContent').textContent = data.llm_analysis;
            document.getElementById('llmAnalysis').classList.remove('hidden');
        }

        hideStatus();
    }

    function renderDetections(arr, summary) {
        const list = document.getElementById('detectionsList');
        if (!arr.length) {
            list.innerHTML = `
                <div class="text-center text-gray-500 py-12">
                    <div class="text-4xl mb-3">❌</div>
                    <p class="text-sm">No wildlife detected</p>
                </div>`;
        } else {
            list.innerHTML = arr.map((d, i) => `
                <div class="bg-black/60 p-4 rounded-lg border-l-4 ${i % 2 ? 'border-red-400' : 'border-primary-400'} hover:bg-black/80 transition-all duration-300">
                    <div class="font-bold text-lg text-primary-300 uppercase">${d.animal}</div>
                    <div class="text-sm text-gray-300 mt-1">CONF: ${(d.confidence * 100).toFixed(1)}%</div>
                    ${d.bbox ? `<div class="text-xs text-gray-500 mt-1">POS: [${d.bbox.join(', ')}]</div>` : ''}
                </div>`
            ).join('');
        }

        if (summary) {
            document.getElementById('summaryContent').textContent = summary.includes('Source:')
                ? summary.replace(/Source:\s*(.+)/, (match, filename) => `Source: ${truncateFilename(filename)}`)
                : summary;
        }
    }

    function resetYoutubeButton() {
        const processBtn = document.getElementById('youtubeProcessBtn');
        if (processBtn) {
            processBtn.disabled = false;
            processBtn.textContent = 'ANALYZE STREAM';
            processBtn.classList.remove('opacity-50');
        }
    }

    window.showDetections = showDetections;
    window.showStatus = showStatus;
    window.hideStatus = hideStatus;
    window.displayImageResults = displayImageResults;
    window.resetView = resetView;
    window.resetDetectionState = resetDetectionState;
    window.processYoutube = processYoutube;
    window.resetYoutubeButton = resetYoutubeButton;
</script>
